<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Security Questions</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
     <style>
        
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-image: url("../static/img/pest.jpg");
    background-repeat: no-repeat;
    background-size: cover;
}

.forgot-password-container {
    background: rgba(255, 255, 255, 0.448);
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    width: 300px;
    text-align: center;
}

h2 {
    margin-bottom: 20px;
}

label {
    font-size: 14px;
    margin-bottom: 5px;
    display: block;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0 20px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 4px;
    width: 100%;
}

button:hover {
    background-color: #45a049;
}

#message {
    margin-top: 20px;
    font-size: 14px;
    color: green;
}

     </style>
</head>
<body>
<div id="header"></div>

    <div class="forgot-password-container">
        <h2>Forgot Password</h2>
        <form id="forgot-password-form">
            <label for="email">Enter your email:</label>
            <input type="email" id="email" name="email" required>

       

            <label for="answer">Password:</label>
            <input type="text" id="Password" name="Password" required>

            <button type="submit">Change Password</button>
        </form>

        <div id="message"></div>
    </div>
   <div id="footer"></div>
    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', function(e) {
    e.preventDefault(); 

    
    const email = document.getElementById('email').value;
    const securityQuestion = document.getElementById('security-question').value;
    const answer = document.getElementById('answer').value;

    
    if (email === '' || answer === '') {
        showMessage('Please fill in all fields.', 'red');
        return;
    }

    const users = {
        "user@example.com": {
            question: "pet",
            answer: "Fluffy"
        },
        "anotheruser@example.com": {
            question: "city",
            answer: "Paris"
        }
    };

    
    if (users[email]) {
        
        if (users[email].question === securityQuestion && users[email].answer.toLowerCase() === answer.toLowerCase()) {
            showMessage('Password reset link has been sent to your email.', 'green');
        } else {
            showMessage('Incorrect answer to the security question.', 'red');
        }
    } else {
        showMessage('Email not found in our system.', 'red');
    }
});


function showMessage(message, color) {
    const messageElement = document.getElementById('message');
    messageElement.textContent = message;
    messageElement.style.color = color;
}
    </script>
    <!-- <script type="module" src="../static/js/script.js"></script> -->

   
    
</body>
</html>
