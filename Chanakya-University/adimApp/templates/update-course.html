<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Update Course</title>

<style>

/* BODY */
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #e0ecff, #f5f7fa);
    margin: 0;
}

/* NAVBAR */
.navbar {
    background: #0f172a;
    color: white;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar h2 {
    margin: 0;
}

.navbar a {
    color: #00c6ff;
    text-decoration: none;
    font-weight: 500;
}

/* MAIN WRAPPER */
.wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 0;
}

/* FORM BOX */
.form-container {
    background: white;
    padding: 30px;
    width: 650px;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}

/* TITLE */
h2 {
    text-align: center;
    margin-bottom: 25px;
}

/* ROW */
.form-row {
    display: flex;
    gap: 12px;
}

/* INPUT */
input, textarea, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    transition: 0.3s;
    font-size: 14px;
}

/* FOCUS */
input:focus, textarea:focus, select:focus {
    border-color: #0072ff;
    box-shadow: 0 0 5px rgba(0,114,255,0.2);
    outline: none;
}

/* IMAGE PREVIEW */
.preview {
    text-align: center;
    margin-bottom: 10px;
}

.preview img {
    width: 120px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    border: none;
    color: white;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,114,255,0.3);
}

/* HOVER */
button:hover {
    opacity: 0.9;
}

/* RESPONSIVE */
@media(max-width:600px) {
    .form-container {
        width: 90%;
    }

    .form-row {
        flex-direction: column;
    }
}

</style>

</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
    <h2>Admin Panel</h2>
    <a href="/admindashboard/">⬅ Back to Dashboard</a>
</header>

<!-- FORM -->
<div class="wrapper">

<div class="form-container">

<h2>Update Course ✏️</h2>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<input name="name" value="{{ c.name }}" placeholder="Course Name" required>

<textarea name="description" placeholder="Description">{{ c.description }}</textarea>

<div class="form-row">
    <input name="duration" value="{{ c.duration }}" placeholder="Duration">
    <input name="fee" value="{{ c.fee }}" placeholder="Fee">
</div>

<div class="form-row">
    <input name="category" value="{{ c.category }}" placeholder="Category">
    <input name="level" value="{{ c.level }}" placeholder="Level">
</div>

<div class="form-row">
    <input name="seats" value="{{ c.seats }}" placeholder="Seats">
    <input name="status" value="{{ c.status }}" placeholder="Status">
</div>

<div class="form-row">
    <input name="mode" value="{{ c.mode }}" placeholder="Mode">
    <input name="location" value="{{ c.location }}" placeholder="Location">
</div>

<!-- IMAGE PREVIEW -->
<div class="preview">
    {% if c.image %}
        <img src="{{ c.image.url }}">
    {% endif %}
</div>

<input type="file" name="image">

<button type="submit">Update Course</button>

</form>

</div>

</div>

</body>
</html>
