<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agriculture Trade Message</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
     <style>
        /* Resetting default margin and padding */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f7f9fc;
    padding: 20px;
}

.container {
    width: 80%;
    margin: 0 auto;
    background-color: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

/* Header */
header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    font-size: 2.5em;
    color: #2c8f3d;
}

/* Form section */
.form-section {
    margin-bottom: 30px;
}

h2 {
    color: #2c8f3d;
    text-align: center;
    margin-bottom: 20px;
}

form {
    display: flex;
    flex-direction: column;
    align-items: center;
}

form label {
    margin: 10px 0 5px;
    font-weight: bold;
}

form input,
form textarea {
    width: 70%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

form button {
    padding: 10px 20px;
    background-color: #2c8f3d;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
}

form button:hover {
    background-color: #3c9e4f;
}

/* Response section */
.response-section {
    margin-top: 30px;
    text-align: center;
}

#responseMessage {
    margin-top: 15px;
    padding: 20px;
    background-color: #f0f8ff;
    border: 1px solid #ccc;
    border-radius: 5px;
    display: none;
    font-size: 1.1em;
    color: #555;
}

/* Footer */
footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.9em;
    color: #777;
}

     </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Agriculture Trade - Send Your Message</h1>
        </header>

        <section class="form-section">
            <h2>Send us your inquiry</h2>
            <form id="messageForm">
                <label for="name">Your Name:</label>
                <input type="text" id="name" required placeholder="Enter your name">
                
                <label for="email">Your Email:</label>
                <input type="email" id="email" required placeholder="Enter your email">

                <label for="message">Your Message:</label>
                <textarea id="message" rows="5" required placeholder="Enter your message about agriculture trade"></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section class="response-section">
            <h2>Submitted Message</h2>
            <div id="responseMessage"></div>
        </section>

        <footer>
            <p>&copy; 2025 Agriculture Trade. All rights reserved.</p>
        </footer>
    </div>

    <script>
        document.getElementById("messageForm").addEventListener("submit", function(event) {
    event.preventDefault();  // Prevent form from refreshing the page

    // Get the values from the form
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;

    // Create a response message to display
    const responseMessage = `
        <h3>Thank you for your message, ${name}!</h3>
        <p><strong>Email:</strong> ${email}</p>
        <p><strong>Your Message:</strong></p>
        <p>${message}</p>
    `;

    // Display the response message
    const responseSection = document.getElementById("responseMessage");
    responseSection.innerHTML = responseMessage;
    responseSection.style.display = "block";  // Show the response section

    // Optionally, clear the form fields
    document.getElementById("messageForm").reset();
});

    </script>
</body>
</html>
