<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: 'Arial', sans-serif;
           margin: 0;
           padding: 0;
           box-sizing: border-box;
           background-color: aquamarine;
           background-image: url("/static/img/pest.jpg");
           /* align-items: center; */
        }
        h1{
            color: blue;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
        }
        table{
            text-align: center;
             background: white; 
            width: 80%;
            height: 100%;
            
            padding: 10px;
            border-radius: 5px;
            margin: 20px;
            justify-self: end;
        }
        tr{
            color: black;
            font-size: 20px;
            border-radius: 3px;
        }
        th{
            color: crimson;
            font-size: 20px;
            font-weight: 500;
            border-radius: 3px;
        }
        td{
            margin: 2px;
            border-radius: 3px;
            /* justify-content: space-between; */
        }
        
    </style>
</head>
<body>
  <h1><u>Users List</u></h1>

 <table border="1">
    <thead>
        <th>Userid </th>
        <th>Name</th>
        <th>Address</th>
        <th>Mobile_number</th>
        <th>Email_id</th>
    </thead>
    <tbody>
        {% for user2 in users %}
        <tr>
            <td>{{user2.userid}}</td>
            <td>{{user2.name}}</td>
            <td>{{user2.address}}</td>
            <td>{{user2.mobilenumber}}</td>
            <td>{{user2.emailid}}</td>
        </tr>
        {% endfor %}
    </tbody>
 </table>
</body>


</html>
